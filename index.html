<!DOCTYPE html>
<html>
<body>

<button onclick="startVideo()">Play Video</button>

<video id="vid" controls width="800">
    <source src="video.mp4" type="video/mp4">
</video>

<script>
function startVideo() {
    let v = document.getElementById("vid");
    v.muted = false;
    v.play();
}
</script>

</body>
</html>
