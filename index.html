<!DOCTYPE html>
<html>
<body>

<video id="vid" autoplay muted controls width="800">
    <source src="video.mp4" type="video/mp4">
</video>

<script>
let v = document.getElementById("vid");

v.play().then(() => {
    v.muted = false;
}).catch(() => {
    console.log("Autoplay blocked");
});
</script>

</body>
</html>
