<!DOCTYPE html>
<html>
<body>

<button onclick="startVideo()">Play Video</button>
    
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
}

video{
    width:800px;
    
}

<video id="vid" controls poster="preview.jpg">
    <source src="video.mp4" type="video/mp4">
</video>

<script>
function startVideo() {
    let v = document.getElementById("vid");
    v.muted = false;
    v.play();
}
</script>

</body>
</html>
